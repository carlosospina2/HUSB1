# =============================================================================
# Eventify — Configuración HU-SB2 (JPA + H2)
# =============================================================================

server.port=8080
spring.application.name=eventify

# =============================================================================
# H2 — Base de datos embebida en modo archivo (persistencia real entre reinicios)
#
# MODE=PostgreSQL → H2 emula comportamiento PostgreSQL (tipos, funciones).
# DB_CLOSE_ON_EXIT=FALSE → H2 no cierra la BD al terminar la JVM.
# DB_CLOSE_DELAY=-1 → mantiene la conexión abierta mientras la app corre.
# =============================================================================
spring.datasource.url=jdbc:h2:file:./data/eventify;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================================================
# JPA / Hibernate
#
# ddl-auto=update → Hibernate crea/actualiza las tablas al arrancar.
#   En producción se usaría "validate" + migraciones Flyway/Liquibase.
# show-sql=true   → muestra las queries generadas en consola (útil en desarrollo).
# dialect         → dialecto H2 (Hibernate lo detecta automáticamente, pero
#                   se declara explícitamente para evitar warnings).
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================================================
# Consola web de H2
# Acceso: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/eventify
# Usuario: sa  |  Contraseña: (vacía)
# =============================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =============================================================================
# Swagger / SpringDoc
# =============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list

# =============================================================================
# Logs
# =============================================================================
logging.level.com.eventify=INFO
logging.level.org.hibernate.SQL=DEBUG
