# =============================================================================
# Eventify HU-SB3 — Configuración
# =============================================================================

server.port=8080
spring.application.name=eventify

# =============================================================================
# H2 — Archivo persistente (los datos sobreviven reinicios)
# =============================================================================
spring.datasource.url=jdbc:h2:file:./data/eventify;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================================================
# Consola web H2
# Acceso: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/eventify
# =============================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =============================================================================
# Thymeleaf
# cache=false → recarga las plantillas sin reiniciar (útil en desarrollo)
# =============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =============================================================================
# Swagger / SpringDoc
# paths-to-match=/api/** → Swagger SOLO documenta rutas /api/
# Las rutas /admin/** (Thymeleaf) quedan fuera de la documentación.
# =============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/**

# =============================================================================
# Logs
# =============================================================================
logging.level.com.eventify=INFO
