# =============================================================================
# Eventify — Configuración de la aplicación
# =============================================================================

# Puerto del servidor embebido
server.port=8080

# Nombre de la aplicación
spring.application.name=eventify

# =============================================================================
# Swagger / SpringDoc OpenAPI
# =============================================================================

# Ruta del JSON de especificación OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Ruta de la interfaz gráfica Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Ordena los endpoints por método HTTP en la UI (GET antes que POST)
springdoc.swagger-ui.operations-sorter=method

# Ordena los tags alfabéticamente en la UI
springdoc.swagger-ui.tags-sorter=alpha

# Expande todas las operaciones al abrir la UI (true = expandido, false = colapsado)
springdoc.swagger-ui.doc-expansion=list

# =============================================================================
# Logs (nivel INFO para ver el Seeder y el arranque claramente)
# =============================================================================
logging.level.com.eventify=INFO
