# =============================================================================
# Eventify HU-SB4 — Configuración
# =============================================================================

server.port=8080
spring.application.name=eventify

# =============================================================================
# H2 — Archivo persistente
# =============================================================================
spring.datasource.url=jdbc:h2:file:./data/eventify4;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================================================
# JPA / Hibernate
# ddl-auto=none → Flyway controla el esquema completamente (regla HU-SB4).
# Hibernate NO crea ni modifica tablas.
# =============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Auditoría SQL — Escenario 1: muestra sentencias formateadas + parámetros reales
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =============================================================================
# Flyway — Motor de migraciones versionadas
# enabled=true  → Flyway gestiona el esquema.
# locations     → carpeta de scripts V1, V2, V3.
# baseline-on-migrate=true → útil si la BD ya existe (no falla en BD vacía).
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Consola H2
# =============================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =============================================================================
# Thymeleaf
# =============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =============================================================================
# Swagger — solo documenta /api/**
# =============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.paths-to-match=/api/**

# =============================================================================
# Tamaño de página por defecto para Slice
# =============================================================================
eventify.page.size=10
