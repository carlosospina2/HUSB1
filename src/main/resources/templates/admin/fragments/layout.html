<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<!-- =====================================================================
     FRAGMENTO: head
     ===================================================================== -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | Eventify'">Eventify</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f0f2f5; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .empty-state   { text-align:center; padding:3rem 0; color:#6c757d; }
        .empty-state i { font-size:3rem; display:block; margin-bottom:1rem; }
        .slice-nav .btn:disabled { opacity:.45; cursor:not-allowed; }
        .badge-category { font-size:.75rem; }
    </style>
</head>

<!-- =====================================================================
     FRAGMENTO: navbar
     ===================================================================== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">
            <i class="bi bi-calendar-event-fill me-2 text-warning"></i>Eventify
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">
                        <i class="bi bi-speedometer2 me-1"></i>Panel
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/events}">
                        <i class="bi bi-calendar3 me-1"></i>Eventos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/venues}">
                        <i class="bi bi-geo-alt me-1"></i>Venues
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/categories}">
                        <i class="bi bi-tags me-1"></i>Categorías
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/swagger-ui.html" target="_blank">
                        <i class="bi bi-code-slash me-1"></i>API
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- =====================================================================
     FRAGMENTO: footer
     ===================================================================== -->
<footer th:fragment="footer" class="text-center text-muted mt-5 py-3 border-top small">
    Eventify HU-SB4 &copy; 2025 — Spring Boot · JPA · Flyway · Thymeleaf
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
