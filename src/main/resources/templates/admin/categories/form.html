<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{admin/fragments/layout :: head('Nueva Categoría')}"></head>
<body>
<nav th:replace="~{admin/fragments/layout :: navbar}"></nav>
<div class="container">
<div class="row justify-content-center">
<div class="col-lg-6">

    <div class="d-flex align-items-center gap-2 mb-4">
        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="mb-0">
            <i class="bi bi-tag me-2 text-warning"></i>Nueva Categoría
        </h2>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}">Error</span>
    </div>

    <div class="card shadow-sm">
    <div class="card-body p-4">
        <form th:action="@{/admin/categories}" th:object="${category}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">
                    Nombre <span class="text-danger">*</span>
                </label>
                <input type="text" id="name" th:field="*{name}"
                       class="form-control" required
                       placeholder="Ej: Conciertos"/>
            </div>
            <div class="mb-4">
                <label for="description" class="form-label fw-semibold">Descripción</label>
                <textarea id="description" th:field="*{description}"
                          class="form-control" rows="3"
                          placeholder="Descripción opcional..."></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-floppy me-1"></i>Guardar
                </button>
                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
    </div>
</div>
</div>
</div>
<footer th:replace="~{admin/fragments/layout :: footer}"></footer>
<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
