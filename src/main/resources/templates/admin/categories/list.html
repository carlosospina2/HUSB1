<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{admin/fragments/layout :: head('Categorías')}"></head>
<body>
<nav th:replace="~{admin/fragments/layout :: navbar}"></nav>
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-tags me-2 text-warning"></i>Gestión de Categorías</h2>
        <a th:href="@{/admin/categories/nueva}" class="btn btn-warning">
            <i class="bi bi-plus-circle me-1"></i>Nueva Categoría
        </a>
    </div>

    <div th:unless="${not #lists.isEmpty(categories)}" class="empty-state">
        <i class="bi bi-tags"></i>
        <h5>No hay categorías registradas</h5>
    </div>

    <div th:if="${not #lists.isEmpty(categories)}" class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-warning">
                    <tr><th>#</th><th>Nombre</th><th>Descripción</th><th class="text-center">Acciones</th></tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td th:text="${cat.id}">1</td>
                        <td><span class="badge bg-warning text-dark fs-6" th:text="${cat.name}">Cat</span></td>
                        <td class="text-muted small"
                            th:text="${cat.description != null ? #strings.abbreviate(cat.description, 80) : '—'}">Desc</td>
                        <td class="text-center">
                            <form th:action="@{/admin/categories/{id}/eliminar(id=${cat.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar categoría?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small">
            Total: <strong th:text="${#lists.size(categories)}">0</strong> categoría(s)
        </div>
    </div>
</div>
<footer th:replace="~{admin/fragments/layout :: footer}"></footer>
<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
