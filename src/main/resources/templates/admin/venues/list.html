<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{admin/fragments/layout :: head('Venues')}"></head>
<body>
<nav th:replace="~{admin/fragments/layout :: navbar}"></nav>
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-geo-alt me-2 text-success"></i>Gestión de Venues</h2>
        <a th:href="@{/admin/venues/nuevo}" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i>Nuevo Venue
        </a>
    </div>

    <div th:unless="${not #lists.isEmpty(venues)}" class="empty-state">
        <i class="bi bi-building-x"></i>
        <h5>No hay venues registrados</h5>
        <a th:href="@{/admin/venues/nuevo}" class="btn btn-outline-success mt-2">Crear primero</a>
    </div>

    <div th:if="${not #lists.isEmpty(venues)}" class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-success">
                    <tr>
                        <th>#</th><th>Nombre</th><th>Ciudad</th>
                        <th>Dirección</th><th class="text-end">Capacidad</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${venues}">
                        <td th:text="${v.id}">1</td>
                        <td th:text="${v.name}">Nombre</td>
                        <td><span class="badge bg-info text-dark" th:text="${v.city}">Ciudad</span></td>
                        <td class="text-muted small" th:text="${v.address ?: '—'}">Dirección</td>
                        <td class="text-end">
                            <span class="badge bg-secondary"
                                  th:text="${#numbers.formatInteger(v.capacity,0,'COMMA')}">0</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/venues/{id}/editar(id=${v.id})}"
                               class="btn btn-sm btn-outline-warning me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/venues/{id}/eliminar(id=${v.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar venue?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small">
            Total: <strong th:text="${#lists.size(venues)}">0</strong> venue(s)
        </div>
    </div>
</div>
<footer th:replace="~{admin/fragments/layout :: footer}"></footer>
<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
