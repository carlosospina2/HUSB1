<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Formulario de Venue')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="d-flex align-items-center gap-2 mb-4">
                <a th:href="@{/admin/venues}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h2 class="mb-0">
                    <i class="bi bi-geo-alt me-2 text-success"></i>
                    <span th:if="${venue.id != null}">Editar Venue</span>
                    <span th:unless="${venue.id != null}">Nuevo Venue</span>
                </h2>
            </div>

            <!-- Alerta de error -->
            <div th:if="${error}" class="alert alert-danger d-flex align-items-center">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Error</span>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <!-- Formulario CREACIÓN -->
                    <form th:if="${venue.id == null}"
                          th:action="@{/admin/venues}"
                          th:object="${venue}"
                          method="post">

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">
                                Nombre <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="nombre" th:field="*{nombre}"
                                   class="form-control"
                                   placeholder="Ej: Centro de Convenciones" required/>
                        </div>

                        <div class="mb-3">
                            <label for="direccion" class="form-label fw-semibold">Dirección</label>
                            <input type="text" id="direccion" th:field="*{direccion}"
                                   class="form-control"
                                   placeholder="Ej: Calle 26 # 59-41, Bogotá"/>
                        </div>

                        <div class="mb-4">
                            <label for="capacidad" class="form-label fw-semibold">
                                Capacidad <span class="text-danger">*</span>
                            </label>
                            <input type="number" id="capacidad" th:field="*{capacidad}"
                                   class="form-control" min="1"
                                   placeholder="Ej: 5000" required/>
                            <div class="form-text">Número máximo de personas.</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-floppy me-1"></i>Guardar
                            </button>
                            <a th:href="@{/admin/venues}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>

                    <!-- Formulario EDICIÓN -->
                    <form th:if="${venue.id != null}"
                          th:action="@{/admin/venues/{id}/editar(id=${venue.id})}"
                          th:object="${venue}"
                          method="post">

                        <div class="mb-3">
                            <label for="nombreEdit" class="form-label fw-semibold">
                                Nombre <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="nombreEdit" th:field="*{nombre}"
                                   class="form-control" required/>
                        </div>

                        <div class="mb-3">
                            <label for="direccionEdit" class="form-label fw-semibold">Dirección</label>
                            <input type="text" id="direccionEdit" th:field="*{direccion}"
                                   class="form-control"/>
                        </div>

                        <div class="mb-4">
                            <label for="capacidadEdit" class="form-label fw-semibold">
                                Capacidad <span class="text-danger">*</span>
                            </label>
                            <input type="number" id="capacidadEdit" th:field="*{capacidad}"
                                   class="form-control" min="1" required/>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-pencil-square me-1"></i>Actualizar
                            </button>
                            <a th:href="@{/admin/venues}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
