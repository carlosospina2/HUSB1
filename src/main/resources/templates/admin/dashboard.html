<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{admin/fragments/layout :: head('Panel')}"></head>
<body>
<nav th:replace="~{admin/fragments/layout :: navbar}"></nav>
<div class="container">

    <h2 class="mb-4"><i class="bi bi-speedometer2 me-2 text-warning"></i>Panel Administrativo</h2>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm border-start border-primary border-4">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-calendar3 text-primary fs-1"></i>
                    <div>
                        <div class="fs-1 fw-bold text-primary" th:text="${totalEvents}">0</div>
                        <div class="text-muted">Eventos activos</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/admin/events}" class="btn btn-sm btn-outline-primary">Ver eventos</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-start border-success border-4">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-geo-alt text-success fs-1"></i>
                    <div>
                        <div class="fs-1 fw-bold text-success" th:text="${totalVenues}">0</div>
                        <div class="text-muted">Venues</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/admin/venues}" class="btn btn-sm btn-outline-success">Ver venues</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-start border-warning border-4">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-tags text-warning fs-1"></i>
                    <div>
                        <div class="fs-1 fw-bold text-warning" th:text="${totalCategories}">0</div>
                        <div class="text-muted">Categorías</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/admin/categories}" class="btn btn-sm btn-outline-warning">Ver categorías</a>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <a th:href="@{/admin/events/nuevo}"    class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Nuevo Evento</a>
        <a th:href="@{/admin/venues/nuevo}"    class="btn btn-success"><i class="bi bi-plus-circle me-1"></i>Nuevo Venue</a>
        <a th:href="@{/admin/categories/nueva}" class="btn btn-warning"><i class="bi bi-plus-circle me-1"></i>Nueva Categoría</a>
    </div>

</div>
<footer th:replace="~{admin/fragments/layout :: footer}"></footer>
<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
