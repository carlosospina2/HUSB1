<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Panel Principal')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-speedometer2 me-2 text-primary"></i>Panel Administrativo</h2>
        <span class="text-muted">Bienvenido, Coordinador</span>
    </div>

    <!-- =====================================================================
         Tarjetas de resumen
         th:text muestra los contadores pasados desde AdminDashboardController
         ===================================================================== -->
    <div class="row g-4 mb-5">

        <div class="col-md-6">
            <div class="card card-counter shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-calendar3 text-primary" style="font-size:2.5rem;"></i>
                    <div>
                        <div class="fs-1 fw-bold text-primary" th:text="${totalEvents}">0</div>
                        <div class="text-muted">Eventos registrados</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/admin/events}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-arrow-right me-1"></i>Ver eventos
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card card-counter shadow-sm h-100"
                 style="border-left-color: #198754;">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-geo-alt text-success" style="font-size:2.5rem;"></i>
                    <div>
                        <div class="fs-1 fw-bold text-success" th:text="${totalVenues}">0</div>
                        <div class="text-muted">Venues disponibles</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/admin/venues}" class="btn btn-sm btn-outline-success">
                        <i class="bi bi-arrow-right me-1"></i>Ver venues
                    </a>
                </div>
            </div>
        </div>

    </div>

    <!-- Accesos rápidos -->
    <h5 class="mb-3 text-muted">Acciones rápidas</h5>
    <div class="d-flex gap-2 flex-wrap">
        <a th:href="@{/admin/events/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Nuevo Evento
        </a>
        <a th:href="@{/admin/venues/nuevo}" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i>Nuevo Venue
        </a>
    </div>

</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
