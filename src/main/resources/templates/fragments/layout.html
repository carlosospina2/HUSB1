<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<!--
    Fragmento de layout compartido por todas las vistas del panel admin.
    Se incluye con th:replace="fragments/layout :: head" y ":: navbar".

    Contiene:
      - head: meta, título, Bootstrap CSS
      - navbar: barra de navegación con enlaces al panel, eventos y venues
-->

<!-- =========================================================
     FRAGMENTO: head
     Uso: <head th:replace="~{fragments/layout :: head(titulo='Mi página')}">
     ========================================================= -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | Eventify Admin'">Eventify Admin</title>
    <!-- Bootstrap 5 CDN -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .table-hover tbody tr:hover { background-color: #e9f5ff; }
        .card-counter { border-left: 4px solid #0d6efd; }
        .empty-state { text-align: center; padding: 3rem 0; color: #6c757d; }
        .empty-state i { font-size: 3rem; display: block; margin-bottom: 1rem; }
    </style>
</head>

<!-- =========================================================
     FRAGMENTO: navbar
     Uso: <nav th:replace="~{fragments/layout :: navbar}">
     ========================================================= -->
<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">
            <i class="bi bi-calendar-event me-2"></i>Eventify
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">
                        <i class="bi bi-speedometer2 me-1"></i>Panel
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/events}">
                        <i class="bi bi-calendar3 me-1"></i>Eventos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/venues}">
                        <i class="bi bi-geo-alt me-1"></i>Venues
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/swagger-ui.html" target="_blank">
                        <i class="bi bi-code-slash me-1"></i>API Docs
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- =========================================================
     FRAGMENTO: footer
     ========================================================= -->
<footer th:fragment="footer" class="text-center text-muted mt-5 py-3 border-top">
    <small>Eventify Admin Panel &copy; 2025 &mdash; Spring Boot + Thymeleaf</small>
</footer>

<!-- Bootstrap JS (para navbar toggler en móvil) -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
